name: keepalive

# 매주 일요일 한국시간 14시 + 수동 실행
on:
  schedule:
    - cron: "17 5 * * 0"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: 모든 워크플로 활성화 (60일 자동중지 방지)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          ids=$(gh api "repos/$REPO/actions/workflows" --paginate \
                  --jq '.workflows[] | select(.state != "deleted") | .id')
          for id in $ids; do
            name=$(gh api "repos/$REPO/actions/workflows/$id" --jq '.name')
            if gh api -X PUT "repos/$REPO/actions/workflows/$id/enable" --silent 2>/dev/null; then
              echo "  활성화 완료 : $name"
            else
              echo "  건너뜀      : $name"
            fi
          done
          echo "타이머가 초기화되었습니다. 다음 갱신: 7일 후"

      - uses: actions/checkout@v4

      - name: 활동 기록 남기기 (2차 안전망)
        run: |
          mkdir -p .github
          date -u +"last keepalive: %Y-%m-%d %H:%M UTC" > .github/keepalive.txt
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive.txt
          git diff --staged --quiet || git commit -m "chore: keepalive $(date -u +%F)"
          git push || true
